<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategic Understanding – Titled Tuesday Training</title>
<style>
:root{--fs:20px;--paper:#fbfaf7;--ink:#1d1f22;--muted:#5d6670;--line:#e2e0da;--card:#fff;--main:#1f4fa3;--mainbg:#1f4fa3;--mainfg:#fff;--btn:#fff;--btnb:#cfd5db}
:root[data-theme="dark"]{--paper:#16191d;--ink:#e4e6e9;--muted:#9aa3ad;--line:#2c3238;--card:#1d2126;--main:#86b4ff;--mainbg:#2f5ea8;--mainfg:#fff;--btn:#232930;--btnb:#3a434c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16191d;--ink:#e4e6e9;--muted:#9aa3ad;--line:#2c3238;--card:#1d2126;--main:#86b4ff;--mainbg:#2f5ea8;--mainfg:#fff;--btn:#232930;--btnb:#3a434c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.5}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px;flex-wrap:wrap}
.top input{flex:1;min-width:160px;max-width:360px;font:inherit;padding:7px 12px;border:1px solid var(--btnb);border-radius:8px;background:var(--btn);color:var(--ink)}
.sp{flex:1}
.ctrls{display:flex;gap:6px}
button{font:inherit;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:40px}
header.hero{max-width:1100px;margin:0 auto;padding:36px 16px 10px}
.kicker{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:system-ui,"Segoe UI",sans-serif;font-size:2.2em;line-height:1.1;margin:.15em 0 .2em}
.sub{color:var(--muted);margin:0;font-size:.9em}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px;display:grid;gap:18px}
.card{display:flex;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;align-items:flex-start}
.info{min-width:0}
.meta{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
h2{font-family:system-ui,"Segoe UI",sans-serif;font-size:1.3em;margin:.15em 0}
h2 a{color:var(--ink);text-decoration:none}h2 a:hover{color:var(--main)}
.theme{color:var(--main);font-family:system-ui,"Segoe UI",sans-serif;font-size:.85em;font-weight:600;margin:.1em 0}
.dek{color:var(--muted);font-size:.9em;margin:.3em 0 .5em}
.btns{display:flex;gap:10px;flex-wrap:wrap;font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.b{padding:8px 16px;border-radius:8px;border:1px solid var(--btnb);color:var(--ink);text-decoration:none;background:var(--btn)}
.b.main{background:var(--mainbg);color:var(--mainfg);border-color:var(--mainbg);font-weight:600}
.count{font-family:system-ui,"Segoe UI",sans-serif;font-size:14px;color:var(--muted)}
.none{color:var(--muted);font-style:italic;padding:20px 0}
@media(max-width:680px){.card{flex-direction:column}.top{padding:8px 12px}.top input{min-width:120px}.top .sp{display:none}}
</style>
</head>
<body>
<div class="top">
  <input id="q" type="search" placeholder="Search session, theme…" aria-label="Search">
  <a href="training.html" style="font-size:14px;font-weight:600;color:var(--main);text-decoration:none;white-space:nowrap;font-family:system-ui,'Segoe UI',sans-serif">🎯 Training</a>
  <span class="sp"></span>
  <span class="count" id="count"></span>
  <div class="ctrls">
    <button id="fm" title="Smaller text">A−</button><button id="fp" title="Larger text">A+</button><button id="dk">Dark</button>
  </div>
</div>
<header class="hero">
  <div class="kicker">Chess.com Titled Tuesday · Strategic Understanding</div>
  <h1>Strategic Understanding</h1>
  <p class="sub">Each week: positions pulled from Titled Tuesday Blitz, organised into four training phases – Transition to Middlegame, Middlegame, Transition to Endgame, and Basic Endgame.</p>
</header>
<main id="list"></main>

<script>
const SESSIONS = [{"slug":"TTC_101326","title":"Titled Tuesday – October 13 2026","dek":"40 training exercises extracted from the October 13 2026 Titled Tuesday Blitz tournament on Chess.com.","date":"2026-10-13","exercises":40}];

function fmtDate(d){ const [y,m,day]=d.split('-'); return new Date(y,m-1,day).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric'}); }

function renderCard(s){
  return `<div class="card" data-text="${s.title} ${s.dek}">
  <div class="info">
    <div class="meta">Titled Tuesday &middot; ${fmtDate(s.date)}</div>
    <h2><a href="training/${s.slug}/index.html">${s.title}</a></h2>
    <p class="dek">${s.dek}</p>
    <div class="btns">
      <a class="b main" href="training/${s.slug}/index.html">🎯 ${s.exercises} Exercises</a>
    </div>
  </div>
</div>`;
}

function render(list){
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<p class="none">No sessions found.</p>';return;}
  el.innerHTML=list.map(renderCard).join('');
  document.getElementById('count').textContent=list.length+' session'+(list.length===1?'':'s');
}

render(SESSIONS);

document.getElementById('q').addEventListener('input',function(){
  const v=this.value.toLowerCase();
  render(v?SESSIONS.filter(s=>s.title.toLowerCase().includes(v)||s.dek.toLowerCase().includes(v)):SESSIONS);
});

const fs=document.documentElement;
let sz=20;
document.getElementById('fm').onclick=()=>{sz=Math.max(14,sz-1);fs.style.setProperty('--fs',sz+'px')};
document.getElementById('fp').onclick=()=>{sz=Math.min(28,sz+1);fs.style.setProperty('--fs',sz+'px')};
document.getElementById('dk').onclick=function(){
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  this.textContent=cur==='dark'?'Dark':'Light';
};
</script>
</body>
</html>
