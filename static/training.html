<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training · Strategic Understanding</title>
<style>
:root{--fs:17px;--paper:#fbfaf7;--ink:#1d1f22;--muted:#5d6670;--line:#e2e0da;--card:#fff;--main:#1f4fa3;--mainbg:#1f4fa3;--mainfg:#fff;--btn:#fff;--btnb:#cfd5db;--gold:#b07d10;
  --tmg-bg:#dbeafe;--tmg-c:#1e40af;
  --mid-bg:#eef3fc;--mid-c:#1f4fa3;
  --teg-bg:#fef9c3;--teg-c:#854d0e;
  --end-bg:#f0fdf4;--end-c:#166534}
:root[data-theme="dark"]{--paper:#16191d;--ink:#e4e6e9;--muted:#9aa3ad;--line:#2c3238;--card:#1d2126;--main:#86b4ff;--mainbg:#2f5ea8;--mainfg:#fff;--btn:#232930;--btnb:#3a434c;--gold:#c9a030;
  --tmg-bg:#1a2840;--tmg-c:#93c5fd;
  --mid-bg:#1a2535;--mid-c:#86b4ff;
  --teg-bg:#2a2010;--teg-c:#fde047;
  --end-bg:#0f2a1a;--end-c:#4ade80;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16191d;--ink:#e4e6e9;--muted:#9aa3ad;--line:#2c3238;--card:#1d2126;--main:#86b4ff;--mainbg:#2f5ea8;--mainfg:#fff;--btn:#232930;--btnb:#3a434c;--gold:#c9a030;--tmg-bg:#1a2840;--tmg-c:#93c5fd;--mid-bg:#1a2535;--mid-c:#86b4ff;--teg-bg:#2a2010;--teg-c:#fde047;--end-bg:#0f2a1a;--end-c:#4ade80;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:system-ui,'Segoe UI',sans-serif;font-size:var(--fs);line-height:1.5}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line);font-size:14px}
.back{color:var(--main);text-decoration:none;font-weight:600;font-size:13px}
.sp{flex:1}
.dk-btn{font:inherit;font-size:13px;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:6px;padding:4px 10px;cursor:pointer}
.page{max-width:900px;margin:0 auto;padding:32px 20px 80px}
.kicker{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;line-height:1.2;margin-bottom:4px}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:28px}
hr{border:none;height:2px;background:linear-gradient(to right,var(--main) 48px,var(--line) 48px);margin-bottom:32px}
.session-list{display:grid;gap:14px}
.session-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;display:flex;align-items:center;gap:18px}
.session-date{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:110px}
.session-title{font-weight:700;font-size:1rem;margin-bottom:2px}
.session-title a{color:var(--ink);text-decoration:none}
.session-title a:hover{color:var(--main)}
.session-count{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">🏠 Home</a>
  <span class="sp"></span>
  <button class="dk-btn" id="dk">Dark</button>
</div>
<div class="page">
  <div class="kicker">Strategic Understanding · All Sessions</div>
  <h1>Training Sessions</h1>
  <p class="sub">Each session is one Titled Tuesday tournament. Click a session to see its four training phases.</p>
  <hr>
  <div class="session-list">
    <div class="session-card">
      <div class="session-date">Oct 13 2026</div>
      <div>
        <div class="session-title"><a href="training/TTC_101326/index.html">TTC_101326 – October 13 2026</a></div>
        <div class="session-count">40 exercises · Transition to Middlegame · Middlegame · Transition to Endgame · Basic Endgame</div>
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById('dk').onclick=function(){
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  this.textContent=cur==='dark'?'Dark':'Light';
};
</script>
</body>
</html>
